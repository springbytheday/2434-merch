<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2434 Archive</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ── Loading ────────────────────────────────────────── -->
  <div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
    <span id="loadingText">Loading…</span>
  </div>

  <!-- ── Main app (always visible after load) ───────────── -->
  <div id="appPage" style="display:none">
    <header class="site-header">
      <div style="display:flex;align-items:center;gap:.75rem;">
        <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="Toggle menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <span class="logo">2434 <span>Archive</span></span>
      </div>
      <div class="header-actions">

        <!-- Language toggle 
        <div class="view-toggle">
          <button class="view-btn active" id="langEN" onclick="setLang('en')">EN</button>
          <button class="view-btn" id="langJA" onclick="setLang('ja')">日本語</button>
        </div> -->

        <!-- Guest buttons -->
        <button class="btn btn-ghost btn-sm" id="btnSignIn" onclick="openAuthModal('login')"
          style="display:none"></button>
        <button class="btn btn-primary btn-sm" id="btnSignUp" onclick="openAuthModal('signup')"
          style="display:none"></button>

        <!-- Logged-in user -->
        <div class="header-user" id="headerUser" style="display:none">
          <span id="headerUsername"></span>
          <span class="superuser-badge" id="superBadge" style="display:none"></span>
          <span class="superuser-badge admin-badge" id="adminBadge" style="display:none"></span>
        </div>
        <button class="btn btn-ghost btn-sm" id="btnRegistry" style="display:none" onclick="openRegistry()">
          🎨 <span id="btnRegistryLabel">Liver Registry</span>
        </button>
        <!-- Owner-only: manage admins -->
        <button class="btn btn-ghost btn-sm" id="btnUsers" style="display:none" onclick="openUsersModal()">
          👤 <span id="btnUsersLabel">Manage Users</span>
        </button>
        <!-- Owner-only: view audit log -->
        <button class="btn btn-ghost btn-sm" id="btnAuditLog" style="display:none" onclick="openAuditLog()">
          📋 <span id="btnAuditLogLabel">Audit Log</span>
        </button>
        <button class="btn btn-ghost" id="btnImport" style="display:none"
          onclick="document.getElementById('importFileInput').click()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          <span id="btnImportLabel"></span>
        </button>
        <input type="file" id="importFileInput" accept=".csv" style="display:none">
        <button class="btn btn-ghost" id="btnExport" style="display:none" onclick="exportJson()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          <span id="btnExportLabel"></span>
        </button>
        <button class="btn btn-primary" id="btnAdd" style="display:none" onclick="openAdd()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>

        <button class="btn btn-ghost btn-sm" id="btnSignOut" style="display:none" onclick="handleLogout()"></button>
      </div>
    </header>

    <div class="app-body">

      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner">
          <div class="sidebar-heading" id="sidebarHeading">Groups</div>
          <nav class="sidebar-nav" id="sidebarNav">
            <!-- populated by renderSidebar() -->
          </nav>
        </div>
      </aside>

      <!-- Sidebar overlay (mobile) -->
      <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

      <main class="main-content" id="mainContent">
        <!-- Group home (shown when no group selected) -->
        <div id="groupHome" style="display:none">
          <div class="group-home-grid" id="groupHomeGrid"></div>
        </div>

        <div id="itemView" style="display: none;">
          <!-- Stats -->
          <div class="stats">
            <div class="stat-item" id="statItemTotal" onclick="filterByStat('')">
              <span class="stat-label" id="labelStatTotal">Total Items</span>
              <span class="stat-value" id="statTotal">—</span>
            </div>
            <div class="stat-item stat-item-clickable" id="statItemOwned" onclick="filterByStat('owned')">
              <span class="stat-label" id="labelStatOwned">My Owned</span>
              <span class="stat-value" id="statOwned">—</span>
            </div>
            <div class="stat-item stat-item-clickable" id="statItemWishlist" onclick="filterByStat('wishlist')">
              <span class="stat-label" id="labelStatWishlist">My Wishlist</span>
              <span class="stat-value" id="statWishlist">—</span>
            </div>
          </div>
          <!-- Controls -->
          <div class="controls">
            <div class="search-wrap">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input type="text" id="searchInput" class="search-input">
            </div>
            <select id="statusFilter" class="filter-select" style="display:none">
              <option value="">All statuses</option>
              <option value="owned">Owned</option>
              <option value="wishlist">Wishlist</option>
              <option value="none">Not tracked</option>
            </select>
            <select id="typeFilter" class="filter-select">
              <option value="">All types</option>
            </select>
            <select id="liverFilter" class="filter-select">
              <option value="">All livers</option>
            </select>
            <div class="view-toggle">
              <button class="view-btn active" id="viewGrid" onclick="setView('grid')" title="Grid">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="7" height="7" />
                  <rect x="14" y="3" width="7" height="7" />
                  <rect x="3" y="14" width="7" height="7" />
                  <rect x="14" y="14" width="7" height="7" />
                </svg>
              </button>
              <button class="view-btn" id="viewTable" onclick="setView('table')" title="Table">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="8" y1="6" x2="21" y2="6" />
                  <line x1="8" y1="12" x2="21" y2="12" />
                  <line x1="8" y1="18" x2="21" y2="18" />
                  <line x1="3" y1="6" x2="3.01" y2="6" />
                  <line x1="3" y1="12" x2="3.01" y2="12" />
                  <line x1="3" y1="18" x2="3.01" y2="18" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Content -->
          <div id="content"></div>
      </main>
    </div>
  </div>




  <!-- ── Auth modal ─────────────────────────────────────── -->
  <div class="modal-overlay" id="authOverlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <div class="auth-logo" id="authModalTitle">MerchArchive</div>
          <div class="auth-subtitle" id="authModalSubtitle"></div>
        </div>
        <button class="modal-close" onclick="closeAuthModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="auth-tabs">
          <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
          <button class="auth-tab" id="tabSignup" onclick="switchTab('signup')">Create Account</button>
        </div>
        <div id="authMessage"></div>

        <!-- Login -->
        <div id="formLogin">
          <div class="form-group" style="margin-bottom:1rem">
            <label id="labelLoginUsername">Username</label>
            <input type="text" id="loginUsername" autocomplete="username">
          </div>
          <div class="form-group" style="margin-bottom:1.25rem">
            <label id="labelLoginPassword">Password</label>
            <div class="input-reveal">
              <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
              <button type="button" class="reveal-btn" onclick="toggleReveal('loginPassword', this)" tabindex="-1"
                aria-label="Show password">
                <svg class="eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="eye-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" style="display:none">
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
          </div>
          <button class="btn btn-primary btn-full" id="loginBtn" onclick="handleLogin()">Sign In</button>
        </div>

        <!-- Signup -->
        <div id="formSignup" style="display:none">
          <div class="form-group" style="margin-bottom:1rem">
            <label id="labelSignupUsername">Username</label>
            <input type="text" id="signupUsername" autocomplete="username">
          </div>
          <div class="form-group" style="margin-bottom:1rem">
            <label id="labelSignupPassword">Password</label>
            <div class="input-reveal">
              <input type="password" id="signupPassword" autocomplete="new-password">
              <button type="button" class="reveal-btn" onclick="toggleReveal('signupPassword', this)" tabindex="-1"
                aria-label="Show password">
                <svg class="eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="eye-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" style="display:none">
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
          </div>
          <div class="form-group" style="margin-bottom:1.25rem">
            <label id="labelSignupConfirm">Confirm Password</label>
            <div class="input-reveal">
              <input type="password" id="signupConfirm" autocomplete="new-password">
              <button type="button" class="reveal-btn" onclick="toggleReveal('signupConfirm', this)" tabindex="-1"
                aria-label="Show password">
                <svg class="eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="eye-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" style="display:none">
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
          </div>
          <button class="btn btn-primary btn-full" id="signupBtn" onclick="handleSignup()">Create Account</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Merch modal (superuser) ─────────────────────────── -->
  <div class=" modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle"></span>
        <button class="modal-close" onclick="closeModal(),setSaveLoading(false);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="merch-form" onsubmit="return false">
          <div class="form-group">
            <label id="labelFImage">Image URL</label>
            <input type="text" id="fImage">
            <div style="font-size:.72rem;color:var(--muted);margin-top:.25rem" id="fImageTip"></div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label id="labelFSeries">Series *</label>
              <input type="text" id="fSeries" required>
            </div>
            <div class="form-group">
              <label id="labelFLiver">Liver</label>
              <input type="text" id="fLiver">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label id="labelFType">Type</label>
              <select id="fType" class="form-select"></select>
            </div>
            <div class="form-group">
              <label id="labelFReleaseDate">Release Date</label>
              <input type="date" id="fReleaseDate">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label id="labelFCost">Cost</label>
              <input type="number" id="fCost" placeholder="0" min="0" step="any">
            </div>
            <div class="form-group">
              <label id="labelFCurrency">Currency</label>
              <select id="fCurrency" class="form-select"></select>
            </div>
          </div>
          <!-- Cheki-only fields -->
          <div id="chekiFields" style="display:none">
            <hr style="border:none;border-top:1px solid var(--border);margin:.5rem 0 1rem">
            <div
              style="font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.75rem">
              Cheki Set</div>
            <div class="form-group" style="margin-bottom:.75rem">
              <label id="labelFChekiMembers">Members</label>
              <!-- [CHANGED] tag picker populated from liver registry -->
              <div class="member-picker" id="memberPicker"></div>
              <div style="font-size:.72rem;color:var(--muted);margin-top:.35rem">Type to search · select from dropdown
                ·
                Backspace
                to remove last</div>
              <!-- hidden input still holds comma list for saveItem() -->
              <input type="hidden" id="fChekiMembers">
            </div>
            <div class="form-group">
              <label id="labelFChekiVariants">Variants <span style="font-weight:300;color:var(--muted)">(comma
                  separated)</span></label>
              <input type="text" id="fChekiVariants" placeholder="Normal, Rare">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="cancelBtn" onclick="closeModal(),setSaveLoading(false);">Cancel</button>
        <button class="btn btn-primary" id="saveBtn" onclick="saveItem()">Save</button>
      </div>
    </div>
  </div>

  <!-- ── Liver Registry modal ────────────────────────────── -->
  <div class="modal-overlay" id="registryOverlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">🎨 Liver Registry</span>
        <button class="modal-close" onclick="closeRegistry()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body" style="padding:0">
        <!-- Add new liver row -->
        <div
          style="display:flex;gap:8px;padding:1rem 1.5rem;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;">
          <input type="text" id="newLiverName" placeholder="Liver name…" style="flex:1">
          <input type="text" id="newLiverGroup" placeholder="Group (e.g. Speciale)…" style="flex:2;min-width:120px;">
          <input type="color" id="newLiverColor" value="#4a90d9"
            style="width:40px;height:36px;border-radius:6px;border:1px solid var(--border);cursor:pointer;padding:2px;">
          <button class="btn btn-primary btn-sm" onclick="addLiver()">Add</button>
        </div>
        <!-- List -->
        <div id="registryList" style="max-height:400px;overflow-y:auto;"></div>
      </div>
    </div>
  </div>

  <!-- ── Manage Users modal (owner only) — [2026-06-19 #11] ── -->
  <div class="modal-overlay" id="usersOverlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">👤 Manage Users</span>
        <button class="modal-close" onclick="closeUsersModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body" style="padding:0">
        <div style="display:flex;gap:8px;padding:1rem 1.5rem;border-bottom:1px solid var(--border);align-items:center;">
          <input type="text" id="userSearchInput" placeholder="Enter username to promote to admin…" style="flex:1;">
          <button class="btn btn-primary btn-sm" onclick="searchAndPromote()">Promote</button>
        </div>
        <div style="padding:.75rem 1.5rem;font-size:.72rem;color:var(--muted);border-bottom:1px solid var(--border);">
          Current admins (besides you):
        </div>
        <div id="usersList" style="max-height:350px;overflow-y:auto;"></div>
      </div>
    </div>
  </div>

  <!-- ── Audit Log modal (owner only) — [2026-06-19 #11] ── -->
  <div class="modal-overlay" id="auditOverlay">
    <div class="modal" style="max-width:680px;">
      <div class="modal-header">
        <span class="modal-title">📋 Audit Log</span>
        <button class="modal-close" onclick="closeAuditLog()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body" style="padding:0">
        <div id="auditList" style="max-height:500px;overflow-y:auto;"></div>
      </div>
    </div>
  </div>

  <!-- ── Toast ───────────────────────────────────────────── -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
