<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merch Archive</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ── Header ─────────────────────────────────────────── -->
  <header class="site-header">
    <a class="logo" href="#">Merch<span>Archive</span></a>
    <div class="header-actions">
      <button class="btn btn-ghost" onclick="document.getElementById('importFileInput').click()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        Import
      </button>
      <input type="file" id="importFileInput" accept=".json" style="display:none">
      <button class="btn btn-ghost" onclick="exportJson()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        Export
      </button>
      <button class="btn btn-primary" onclick="openAdd()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        Add Item
      </button>
    </div>
  </header>

  <!-- ── Main ───────────────────────────────────────────── -->
  <main>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">Total Items</span>
        <span class="stat-value" id="statTotal">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Owned</span>
        <span class="stat-value" id="statOwned">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Wishlist</span>
        <span class="stat-value" id="statWishlist">0</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name, group, notes…">
      </div>
      <select id="statusFilter" class="filter-select">
        <option value="">All statuses</option>
        <option value="owned">Owned</option>
        <option value="wishlist">Wishlist</option>
      </select>
      <select id="typeFilter" class="filter-select">
        <option value="">All types</option>
      </select>
      <select id="groupFilter" class="filter-select">
        <option value="">All groups</option>
      </select>
      <div class="view-toggle">
        <button class="view-btn active" id="viewGrid" onclick="setView('grid')" title="Grid view">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
          </svg>
        </button>
        <button class="view-btn" id="viewTable" onclick="setView('table')" title="Table view">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6" />
            <line x1="8" y1="12" x2="21" y2="12" />
            <line x1="8" y1="18" x2="21" y2="18" />
            <line x1="3" y1="6" x2="3.01" y2="6" />
            <line x1="3" y1="12" x2="3.01" y2="12" />
            <line x1="3" y1="18" x2="3.01" y2="18" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Content -->
    <div id="content"></div>

  </main>

  <!-- ── Add / Edit Modal ────────────────────────────────── -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Add Merch</span>
        <button class="modal-close" onclick="closeModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="merch-form" onsubmit="return false">

          <!-- Image -->
          <div class="form-group">
            <label>Image</label>
            <div class="image-upload-area" id="imgPreview">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                style="margin-bottom:.5rem">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
              </svg>
              <p>Click to upload image</p>
              <p style="font-size:.7rem;margin-top:.2rem">PNG, JPG, WEBP</p>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display:none">
          </div>

          <!-- Name & Group -->
          <div class="form-row">
            <div class="form-group">
              <label for="fName">Vtuber Name *</label>
              <input type="text" id="fName" placeholder="e.g. Hoshimachi Suisei" required>
            </div>
            <div class="form-group">
              <label for="fGroup">Group / Agency</label>
              <input type="text" id="fGroup" placeholder="e.g. Hololive">
            </div>
          </div>

          <!-- Type & Status -->
          <div class="form-row">
            <div class="form-group">
              <label for="fType">Item Type</label>
              <select id="fType" class="form-select"></select>
            </div>
            <div class="form-group">
              <label for="fStatus">Status</label>
              <select id="fStatus" class="form-select">
                <option value="owned">Owned</option>
                <option value="wishlist">Wishlist</option>
              </select>
            </div>
          </div>

          <!-- Cost -->
          <div class="form-row">
            <div class="form-group">
              <label for="fCost">Cost</label>
              <input type="number" id="fCost" placeholder="0" min="0" step="any">
            </div>
            <div class="form-group">
              <label for="fCurrency">Currency</label>
              <select id="fCurrency" class="form-select"></select>
            </div>
          </div>

          <!-- Notes -->
          <div class="form-group">
            <label for="fNotes">Notes / Condition</label>
            <textarea id="fNotes" placeholder="e.g. Mint condition, signed, limited edition…"></textarea>
          </div>

        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveItem()">Save</button>
      </div>
    </div>
  </div>

  <!-- ── Toast container ─────────────────────────────────── -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>

</html>
